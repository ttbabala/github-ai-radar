[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-ai-radar"
version = "0.1.0"
description = "A repeatable GitHub AI ecosystem trend research agent"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0", "Markdown>=3.6,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["radar"]
